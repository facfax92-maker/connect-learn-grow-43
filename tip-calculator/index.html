<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tip Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-1: #e8f0ea;
      --bg-2: #f4f7f2;
      --surface: rgba(255, 255, 255, 0.78);
      --surface-strong: #ffffff;
      --ink: #1a2e24;
      --muted: #5a6f63;
      --line: rgba(26, 46, 36, 0.12);
      --accent: #1f6b4a;
      --accent-soft: #d7efe4;
      --accent-ink: #ffffff;
      --result: #143528;
      --shadow: 0 18px 50px rgba(26, 46, 36, 0.1);
      --glow: radial-gradient(circle at 20% 10%, rgba(47, 140, 98, 0.22), transparent 42%),
              radial-gradient(circle at 90% 80%, rgba(180, 150, 80, 0.18), transparent 40%);
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    html[data-theme="dark"] {
      --bg-1: #0d1612;
      --bg-2: #15201a;
      --surface: rgba(24, 36, 30, 0.82);
      --surface-strong: #1b2a22;
      --ink: #e8f2ec;
      --muted: #9bb0a4;
      --line: rgba(232, 242, 236, 0.12);
      --accent: #4fbf8b;
      --accent-soft: rgba(79, 191, 139, 0.16);
      --accent-ink: #0d1612;
      --result: #d8f5e7;
      --shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
      --glow: radial-gradient(circle at 18% 12%, rgba(79, 191, 139, 0.18), transparent 40%),
              radial-gradient(circle at 88% 78%, rgba(120, 100, 50, 0.14), transparent 42%);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: "Outfit", sans-serif;
      color: var(--ink);
      background:
        var(--glow),
        linear-gradient(160deg, var(--bg-1), var(--bg-2) 55%, var(--bg-1));
      background-attachment: fixed;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      transition: background 0.45s var(--ease), color 0.35s var(--ease);
    }

    .app {
      width: min(100%, 440px);
      background: var(--surface);
      backdrop-filter: blur(16px);
      border: 1px solid var(--line);
      border-radius: 28px;
      box-shadow: var(--shadow);
      padding: 1.6rem 1.5rem 1.5rem;
      animation: rise 0.6s var(--ease) both;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(18px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .brand {
      display: grid;
      gap: 0.35rem;
    }

    .brand h1 {
      font-family: "Fraunces", serif;
      font-size: clamp(1.7rem, 5vw, 2.1rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.05;
    }

    .brand p {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .theme-toggle {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--surface-strong);
      color: var(--ink);
      width: 48px;
      height: 48px;
      border-radius: 16px;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: transform 0.25s var(--ease), background 0.35s var(--ease), border-color 0.35s var(--ease);
    }

    .theme-toggle:hover {
      transform: translateY(-2px);
    }

    .theme-toggle:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .theme-toggle svg {
      width: 22px;
      height: 22px;
      transition: transform 0.4s var(--ease), opacity 0.3s var(--ease);
    }

    .theme-toggle .moon { display: none; }
    html[data-theme="dark"] .theme-toggle .sun { display: none; }
    html[data-theme="dark"] .theme-toggle .moon { display: block; }

    .field {
      display: grid;
      gap: 0.55rem;
      margin-bottom: 1.15rem;
    }

    label {
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--muted);
    }

    .input-wrap {
      position: relative;
    }

    .input-wrap span {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-weight: 600;
      pointer-events: none;
    }

    input[type="number"] {
      width: 100%;
      border: 1px solid var(--line);
      background: var(--surface-strong);
      color: var(--ink);
      border-radius: 16px;
      padding: 0.95rem 1rem 0.95rem 2.1rem;
      font: inherit;
      font-size: 1.05rem;
      font-weight: 600;
      transition: border-color 0.25s var(--ease), box-shadow 0.25s var(--ease), background 0.35s var(--ease);
    }

    input[type="number"]:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--accent-soft);
    }

    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    input[type="number"] {
      -moz-appearance: textfield;
      appearance: textfield;
    }

    .tips {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.6rem;
    }

    .tip-btn {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--surface-strong);
      color: var(--ink);
      border-radius: 14px;
      padding: 0.85rem 0.5rem;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
      transition: transform 0.2s var(--ease), background 0.25s var(--ease), color 0.25s var(--ease), border-color 0.25s var(--ease);
    }

    .tip-btn:hover {
      transform: translateY(-1px);
      border-color: var(--accent);
    }

    .tip-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-ink);
    }

    .tip-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .custom-tip {
      margin-top: 0.6rem;
    }

    .custom-tip input {
      padding-left: 1rem;
    }

    .results {
      margin-top: 0.35rem;
      background: linear-gradient(145deg, var(--result), color-mix(in srgb, var(--result) 82%, var(--accent)));
      color: #f4fff8;
      border-radius: 22px;
      padding: 1.2rem 1.15rem;
      display: grid;
      gap: 0.85rem;
      animation: softIn 0.5s var(--ease) both;
    }

    html[data-theme="dark"] .results {
      color: #0d1612;
    }

    @keyframes softIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
    }

    .row span {
      opacity: 0.8;
      font-size: 0.92rem;
    }

    .row strong {
      font-family: "Fraunces", serif;
      font-size: 1.35rem;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
    }

    .row.total strong {
      font-size: 1.7rem;
    }

    .divider {
      height: 1px;
      background: rgba(255, 255, 255, 0.18);
    }

    html[data-theme="dark"] .divider {
      background: rgba(13, 22, 18, 0.18);
    }

    .hint {
      margin-top: 0.9rem;
      text-align: center;
      color: var(--muted);
      font-size: 0.82rem;
    }

    @media (max-width: 420px) {
      .app {
        padding: 1.25rem 1.1rem 1.15rem;
        border-radius: 24px;
      }

      .tips {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }
  </style>
</head>
<body>
  <main class="app" aria-labelledby="title">
    <div class="top">
      <div class="brand">
        <h1 id="title">Tip Calculator</h1>
        <p>Split the bill without the guesswork.</p>
      </div>
      <button class="theme-toggle" type="button" id="themeToggle" aria-label="Toggle dark mode" title="Toggle dark mode">
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2.2M12 19.8V22M4.2 12H2M22 12h-2.2M5.05 5.05l1.56 1.56M17.39 17.39l1.56 1.56M18.95 5.05l-1.56 1.56M6.61 17.39l-1.56 1.56" />
        </svg>
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <path d="M20.5 14.3A8.2 8.2 0 0 1 9.7 3.5 8.5 8.5 0 1 0 20.5 14.3Z" />
        </svg>
      </button>
    </div>

    <div class="field">
      <label for="bill">Bill amount</label>
      <div class="input-wrap">
        <span>$</span>
        <input id="bill" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00" value="86.50" />
      </div>
    </div>

    <div class="field">
      <label id="tipLabel">Tip percentage</label>
      <div class="tips" role="group" aria-labelledby="tipLabel">
        <button class="tip-btn" type="button" data-tip="10">10%</button>
        <button class="tip-btn active" type="button" data-tip="15">15%</button>
        <button class="tip-btn" type="button" data-tip="18">18%</button>
        <button class="tip-btn" type="button" data-tip="20">20%</button>
        <button class="tip-btn" type="button" data-tip="25">25%</button>
        <button class="tip-btn" type="button" data-tip="custom">Custom</button>
      </div>
      <div class="input-wrap custom-tip" id="customWrap" hidden>
        <input id="customTip" type="number" inputmode="decimal" min="0" step="0.1" placeholder="Enter tip %" aria-label="Custom tip percentage" />
      </div>
    </div>

    <div class="field">
      <label for="people">Split between</label>
      <div class="input-wrap">
        <span>#</span>
        <input id="people" type="number" inputmode="numeric" min="1" step="1" value="2" />
      </div>
    </div>

    <section class="results" aria-live="polite">
      <div class="row">
        <span>Tip</span>
        <strong id="tipAmount">$0.00</strong>
      </div>
      <div class="row total">
        <span>Total</span>
        <strong id="totalAmount">$0.00</strong>
      </div>
      <div class="divider"></div>
      <div class="row">
        <span>Per person</span>
        <strong id="perPerson">$0.00</strong>
      </div>
    </section>

    <p class="hint">Totals update as you type.</p>
  </main>

  <script>
    (function () {
      const STORAGE_KEY = "tip-calculator-theme";
      const root = document.documentElement;
      const billInput = document.getElementById("bill");
      const peopleInput = document.getElementById("people");
      const customTipInput = document.getElementById("customTip");
      const customWrap = document.getElementById("customWrap");
      const tipButtons = Array.from(document.querySelectorAll(".tip-btn"));
      const tipAmountEl = document.getElementById("tipAmount");
      const totalAmountEl = document.getElementById("totalAmount");
      const perPersonEl = document.getElementById("perPerson");
      const themeToggle = document.getElementById("themeToggle");

      let selectedTip = 15;
      let usingCustom = false;

      function preferredTheme() {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved === "light" || saved === "dark") return saved;
        return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }

      function applyTheme(theme) {
        root.setAttribute("data-theme", theme);
        localStorage.setItem(STORAGE_KEY, theme);
        themeToggle.setAttribute(
          "aria-label",
          theme === "dark" ? "Switch to light mode" : "Switch to dark mode"
        );
      }

      function money(value) {
        return new Intl.NumberFormat("en-US", {
          style: "currency",
          currency: "USD",
        }).format(Number.isFinite(value) ? value : 0);
      }

      function readNumber(input, fallback) {
        const value = Number.parseFloat(input.value);
        return Number.isFinite(value) ? value : fallback;
      }

      function calculate() {
        const bill = Math.max(0, readNumber(billInput, 0));
        const people = Math.max(1, Math.floor(readNumber(peopleInput, 1)));
        const tipPercent = usingCustom
          ? Math.max(0, readNumber(customTipInput, 0))
          : selectedTip;

        const tip = bill * (tipPercent / 100);
        const total = bill + tip;
        const perPerson = total / people;

        tipAmountEl.textContent = money(tip);
        totalAmountEl.textContent = money(total);
        perPersonEl.textContent = money(perPerson);
      }

      function setActiveTip(button) {
        tipButtons.forEach((btn) => btn.classList.toggle("active", btn === button));
        usingCustom = button.dataset.tip === "custom";
        customWrap.hidden = !usingCustom;

        if (usingCustom) {
          customTipInput.focus();
          if (customTipInput.value === "") customTipInput.value = "15";
        } else {
          selectedTip = Number(button.dataset.tip);
        }

        calculate();
      }

      tipButtons.forEach((button) => {
        button.addEventListener("click", () => setActiveTip(button));
      });

      [billInput, peopleInput, customTipInput].forEach((input) => {
        input.addEventListener("input", calculate);
      });

      themeToggle.addEventListener("click", () => {
        const next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
        applyTheme(next);
      });

      applyTheme(preferredTheme());
      calculate();
    })();
  </script>
</body>
</html>
